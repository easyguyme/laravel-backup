# Example: backup.conf for a production project

# ── Retention ──────────────────────────────────────────────
RETENTION_COUNT=7
RETENTION_DAYS=90

# ── Encryption ─────────────────────────────────────────────
ENCRYPTION_ENABLED=true
ENCRYPTION_PASSWORD_SOURCE=env
ENCRYPTION_PASSWORD_FILE=""

# ── Database ───────────────────────────────────────────────
DATABASE_TYPE=""
DATABASE_HOST="127.0.0.1"
DATABASE_PORT=""
DATABASE_NAME=""
DATABASE_USER=""
DATABASE_PASSWORD=""

# ── Paths ──────────────────────────────────────────────────
BACKUP_DIR="backups"
TEMP_DIR="/tmp/laravel-backup"

# ── Compression ────────────────────────────────────────────
COMPRESSION_LEVEL=6

# ── Upload Folders ─────────────────────────────────────────
EXTRA_UPLOAD_DIRS=""
EXCLUDE_DIRS=".git node_modules vendor .env storage/logs"

# ── Git ────────────────────────────────────────────────────
GIT_AUTO_COMMIT=true
GIT_AUTO_TAG=true
GIT_TAG_PREFIX="backup"
GIT_AUTO_PUSH=true
GIT_BACKUP_BRANCH=""

# ── Notifications ──────────────────────────────────────────
NOTIFICATIONS_ENABLED=true
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""
SLACK_WEBHOOK_URL="https://hooks.slack.com/services/XXX/YYY/ZZZ"
DISCORD_WEBHOOK_URL=""
EMAIL_TO="devops@example.com"
EMAIL_FROM="backup@example.com"

# ── Logging ────────────────────────────────────────────────
LOG_LEVEL="INFO"
LOG_FILE="backups/backup.log"

# ── Misc ───────────────────────────────────────────────────
VERBOSE=false
DRY_RUN=false
